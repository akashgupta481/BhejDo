name: Create Release PR

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-release-pr:
    # Only run if PR was merged and not a release or deploy PR
    if: |
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      !startsWith(github.event.pull_request.head.ref, 'deploy/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Determine version bump type
        id: bump_type
        run: |
          PR_TITLE='${{ github.event.pull_request.title }}'
          PR_BODY='${{ github.event.pull_request.body }}'
          PR_LABELS='${{ join(github.event.pull_request.labels.*.name, ',') }}'
          
          # Check for breaking changes or major keywords
          if [[ "${PR_TITLE}" == *"BREAKING CHANGE"* ]] || [[ "${PR_BODY}" == *"BREAKING CHANGE"* ]] || [[ "${PR_LABELS}" == *"breaking"* ]] || [[ "${PR_LABELS}" == *"major"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          # Check for features or minor keywords
          elif [[ "${PR_TITLE}" == *"feat"* ]] || [[ "${PR_TITLE}" == *"feature"* ]] || [[ "${PR_LABELS}" == *"feature"* ]] || [[ "${PR_LABELS}" == *"enhancement"* ]] || [[ "${PR_LABELS}" == *"minor"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          # Default to patch for fixes, docs, chores
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"
          
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          if [ "$BUMP_TYPE" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version will be: $NEW_VERSION (bump type: $BUMP_TYPE)"

      - name: Create release branch
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git checkout -b release/v$NEW_VERSION
          
          # Update version in package.json
          npm version $NEW_VERSION --no-git-tag-version
          
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin release/v$NEW_VERSION

      - name: Generate changelog
        id: changelog
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --reverse main)
          else
            CHANGES=$(git log $PREV_TAG..main --pretty=format:"- %s (%h)" --reverse)
          fi
          
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"
          
          cat > pr_body.md << 'EOF'
          ## 🚀 Release v${{ steps.new_version.outputs.version }}
          
          **Version Bump**: ${{ steps.bump_type.outputs.type }} (${{ steps.current_version.outputs.version }} → ${{ steps.new_version.outputs.version }})
          
          ### 📋 Changes
          
          ${{ steps.changelog.outputs.changes }}
          
          ### ✅ What happens when you merge this PR:
          
          1. Version tag `v${{ steps.new_version.outputs.version }}` will be created
          2. GitHub Release will be published
          3. A **Deploy PR** will be automatically created
          4. You can then merge the Deploy PR to push to production
          
          ### 🔍 Review Checklist:
          
          - [ ] Version number is correct
          - [ ] Changelog includes all changes
          - [ ] Ready for release
          
          ---
          
          **Merged PR**: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
          EOF
          
          gh pr create \
            --title "Release v$NEW_VERSION" \
            --body-file pr_body.md \
            --base main \
            --head release/v$NEW_VERSION \
            --label "release"
