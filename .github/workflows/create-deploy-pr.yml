name: Create Deploy PR

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-deploy-pr:
    # Only run if a release PR was merged
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Git tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 v$VERSION^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --reverse v$VERSION)
          else
            CHANGES=$(git log $PREV_TAG..v$VERSION --pretty=format:"- %s (%h)" --reverse)
          fi
          
          cat > release_notes.md << EOF
          ## What's Changed
          
          $CHANGES
          
          ### Pull Request
          - #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...v$VERSION
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create deploy branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git checkout -b deploy/v$VERSION
          
          # Create a marker file to track deployment
          echo "v$VERSION" > .deploy-version
          git add .deploy-version
          git commit -m "chore: prepare deployment for v$VERSION"
          git push origin deploy/v$VERSION

      - name: Create Deploy PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          cat > deploy_pr_body.md << 'EOF'
          ## 🚀 Deploy v${{ steps.version.outputs.version }} to Production
          
          **Release**: [v${{ steps.version.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }})
          
          ### ✅ What happens when you merge this PR:
          
          1. Frontend will be deployed to Vercel
          2. Backend will be deployed to Render (auto-deploys from main)
          3. Users will see the new version
          
          ### 🔍 Pre-Deployment Checklist:
          
          - [ ] Release notes reviewed
          - [ ] All tests passing
          - [ ] Ready to deploy to production
          
          ### 📊 Deployment Details:
          
          - **Version**: v${{ steps.version.outputs.version }}
          - **Tag**: `v${{ steps.version.outputs.version }}`
          - **Release PR**: #${{ github.event.pull_request.number }}
          
          ---
          
          ⚠️ **Note**: Merging this PR will trigger production deployment.
          Make sure you've reviewed all changes and are ready to go live!
          EOF
          
          gh pr create \
            --title "Deploy v$VERSION to Production" \
            --body-file deploy_pr_body.md \
            --base main \
            --head deploy/v$VERSION \
            --label "deployment"
